# Offline scenario — no Pi, no Docker, no network access.
#
# These roles cannot converge for real: there is no BCM watchdog, no EEPROM and no USB disk on a CI
# runner. So the scenario tests what CAN be tested honestly and says so, rather than pretending:
# the GUARDS, the pure logic (cmdline editing, BOOT_ORDER decoding) and the TEMPLATES.
#
# Every guard is exercised in BOTH directions — a fixture that must pass and one that must fail.
# A guard nobody proved can fire is decoration, and this repo has an audit full of them.
---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  inventory:
    host_vars:
      localhost:
        ansible_connection: local
  playbooks:
    converge: converge.yml
    verify: verify.yml
  env:
    # Molecule runs from inside the role dir, so the sibling roles are not on the search path.
    # Setting it is what lets the scenario call the REAL role rather than reproducing its effects
    # — a scenario that re-implements the role only tests its own copy.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections.galaxy:${MOLECULE_PROJECT_DIRECTORY}/../../../../.."
verifier:
  name: ansible
scenario:
  test_sequence:
    - syntax
    - converge
    - verify
