- name: Derive the image references
  # SEPARATE TASK, deliberately. Keys within one set_fact template against PRE-TASK values and
  # cannot see each other. A derivation referencing bazzite_image_registry alongside its own
  # resolution above would hard-fail ("'bazzite_image_registry' is undefined") whenever the caller
  # leaves it to its default, and work only when the caller happens to set it. (Tested — a loud
  # error, not a silent misread.) The split makes the derivation read the resolved facts.
  #
  # THE TRANSPORT IS HARDCODED, not a variable: ghcr.io/ublue-os is sigstoreSigned in
  # /etc/containers/policy.json, and rebasing to a bare `docker://` ref SUCCEEDS with signature
  # verification silently dropped — the machine then runs an unverified image with nothing saying
  # so. A knob whose only other setting is forbidden is a footgun, not configuration.
  ansible.builtin.set_fact:
    bazzite_image_ref: "{{ bazzite_image_registry }}/{{ bazzite_image_variant }}:{{ bazzite_image_tag }}"
    bazzite_image_refspec: "ostree-image-signed:docker://{{ bazzite_image_registry }}/{{ bazzite_image_variant }}:{{ bazzite_image_tag }}"
