---
# Resolve caller-supplied vars over the generated defaults (defaults/main.yml is GENERATED from
# meta/argument_specs.py — see tools/argspec/cli.py — and holds `*__default` vars, not the plain
# names tasks use). Same pattern as the usb_media role.
#
# THIS FILE IS INCLUDED MORE THAN ONCE PER PLAY. Every entrypoint includes it, `all` runs six,
# and image.yml includes rebase.yml which includes it again. Every resolution here must therefore
# be IDEMPOTENT: on re-entry `x | default(x__default)` finds x already set by the first pass and
# returns it unchanged. Do NOT add a non-idempotent transform (a prefix-add, a path-join) — it
# would apply once or twice depending on the CALL ROUTE, so the value would differ between
# `bazzite_action=rebase` and `bazzite_action=image`. usb_media's `| expanduser` is the in-repo
# example of a transforming line; it is safe only because expanduser happens to be idempotent.
#
# REQUIRED options are referenced BARE, with no `| default(...)`: the generator emits no
# `__default` for them, so a default() argument would name a variable that does not exist.
- name: Store vars
  ansible.builtin.set_fact:
    bazzite_action: "{{ bazzite_action | default(bazzite_action__default) }}"
    bazzite_apply: "{{ bazzite_apply | default(bazzite_apply__default) }}"
    bazzite_flatpaks: "{{ bazzite_flatpaks | default(bazzite_flatpaks__default) }}"
    bazzite_controller_probe_seconds: "{{ bazzite_controller_probe_seconds | default(bazzite_controller_probe_seconds__default) }}"
